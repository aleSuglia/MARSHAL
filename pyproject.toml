[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marshal"
version = "0.1.0"
description = "MARSHAL: Incentivizing Multi-Agent Reasoning via Self-Play with Strategic LLMs"
requires-python = ">=3.10,<3.11"
dependencies = [
	"ray>=2.40.0,<=2.46.0",
	"numpy>=1.25,<2.0a0",
	"tensordict",
	"sympy==1.13.1",
	"transformers>=4.48.3,<4.52",
	"modelscope",
	"datasets==3.1.0",
	"tqdm",
	"peft==0.12.0",
	"tyro>=0.5.7",
	"accelerate==0.34.2",
	"pydantic",
	"pytest",
	"loralib",
	"einops",
	"isort",
	"jsonlines",
	"deprecated",
	"trl==0.9.6",
	"pyext",
	"dacite",
	"codetiming",
	"more_itertools",
	"wandb",
	"math-verify",
	"openai",
	"gym",
	"gymnasium[toy-text]",
	"gym_sokoban",
	"hydra-core",
	"omegaconf",
	"latex2sympy2==1.5.4",
	"latex2sympy2_extended==1.10.1",
	"antlr4-python3-runtime==4.9.3",
	"mcore_adapter",
	"open-spiel>=1.6.11",
	"matplotlib>=3.10.9",
	"click<8.2",
	"tensorboard>=2.20.0",
	"setuptools<75",
	"torchao==0.12.0",
]
[dependency-groups]
dev = [
	"black",
	"pre-commit",
	"pytest-xdist",
	"ruff",
]
torch260-vllm = [
	"torch==2.6.0.*; platform_system == 'Linux'",
	"torchvision==0.21.0.*; platform_system == 'Linux'",
	"torchaudio==2.6.0.*; platform_system == 'Linux'",
	"flash-attn; platform_system == 'Linux'",
	"transformer-engine[pytorch]==2.2.0; platform_system == 'Linux'",
	"deepspeed==0.16.4; platform_system == 'Linux'",
	"vllm==0.8.4; platform_system == 'Linux'",
	"transformers==4.51.2; platform_system == 'Linux'",
]
torch260-sglang = [
	"torch==2.6.0.*; platform_system == 'Linux'",
	"torchvision==0.21.0.*; platform_system == 'Linux'",
	"torchaudio==2.6.0.*; platform_system == 'Linux'",
	"flash-attn; platform_system == 'Linux'",
	"transformer-engine[pytorch]==2.2.0; platform_system == 'Linux'",
	"deepspeed==0.16.4; platform_system == 'Linux'",
	"sglang[srt,torch-memory-saver]==0.4.6.post4; platform_system == 'Linux'",
	"transformers==4.51.1; platform_system == 'Linux'",
	"cuda-bindings==12.9.0; platform_system == 'Linux'",
]

[tool.uv]
no-build-isolation-package = ["transformer-engine", "transformer-engine-torch"]
conflicts = [
	[{ group = "torch260-vllm" }, { group = "torch260-sglang" }],
]

[tool.setuptools.packages.find]
include = ["roll*"]

[tool.uv.sources]
mcore_adapter = { path = "mcore_adapter", editable = true }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.2.post1/flash_attn-2.7.2.post1+cu12torch2.6cxx11abiFALSE-cp310-cp310-linux_x86_64.whl", marker = "platform_system == 'Linux'" }

[tool.uv.extra-build-dependencies]
deepspeed = [{ requirement = "torch", match-runtime = true }]
flash-attn = [{ requirement = "torch", match-runtime = true }]
transformer-engine-torch = ["torch==2.6.0"]

[[tool.uv.dependency-metadata]]
name = "transformer-engine-torch"
version = "2.2.0"
requires-dist = ["torch"]

[tool.black]
line-length = 119
target-version = ['py310']

[tool.ruff]
ignore = ["E501", "E741", "W605"]
select = ["E", "F", "I", "W"]
line-length = 119

# Ignore import violations in all `__init__.py` files.
[tool.ruff.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.isort]
lines-after-imports = 2
known-first-party = ["roll"]
