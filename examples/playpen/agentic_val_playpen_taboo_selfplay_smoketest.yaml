# Very scaled-down copy of agentic_val_playpen_taboo_selfplay.yaml, purely to check the
# code path works (init -> rollout -> reward/advantage -> backward -> checkpoint) on a new
# machine/cluster before committing to the full paper-scale run (env_groups: 64,
# rollout_batch_size: 128, sequence_length: 32768, max_steps: 200). Not meant to produce a
# useful trained model -- see agentic_val_playpen_taboo_selfplay.yaml for the real config.
#
# Everything below is identical to the real config except: max_steps/save_steps/eval_steps,
# sequence_length (shrunk for speed, not fidelity), and train/val_env_manager's
# env_groups/max_env_num_per_worker/n_groups. Model/LoRA/reward settings are left untouched
# so this actually exercises the same code path as the real run.

defaults:
  - ../config/envs@_here_
  - ../config/deepspeed_zero@_here_
  - ../config/deepspeed_zero2@_here_
  - ../config/deepspeed_zero3@_here_
  - ../config/deepspeed_zero3_cpuoffload@_here_

hydra:
  run:
    dir: .
  output_subdir: null

exp_name: "agentic_pipeline"
seed: 42
logging_dir: ./runs/${exp_name}/output/logs
output_dir: ./runs/${exp_name}/output

system_envs:
  USE_MODELSCOPE: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

track_with: tensorboard
tracker_kwargs:
  log_dir: ./runs/${exp_name}/tensorboard_logs

num_gpus_per_node: 1

# Just enough steps to see one full cycle (rollout -> reward/advantage -> backward) plus a
# checkpoint save fire, without waiting through anything close to a real run.
max_steps: 2
save_steps: 1
logging_steps: 1
eval_steps: 1
resume_from_checkpoint: false

# Shrunk purely for smoketest speed -- not testing performance/paper-fidelity here, just
# that the pipeline runs end to end. rollout_batch_size intentionally kept a small multiple
# of env_groups below (2 trajectories/env/step, same ratio as the real config).
rollout_batch_size: 8
val_batch_size: 8
sequence_length: 4096

dual_clip_loss: true
ppo_epochs: 1
adv_estimator: "reinforce"
init_kl_coef: 0.0
use_kl_loss: true
kl_loss_coef: 0.20

whiten_advantages: true
entropy_loss_coef: 0

pretrain: Qwen/Qwen3-0.6B

actor_train:
  model_args:
    flash_attn: fa2
    disable_gradient_checkpointing: false
    dtype: bf16
    model_type: ~
    lora_rank: 16
    lora_alpha: 16
    lora_target: all-linear
  training_args:
    lr_scheduler_type: cosine_with_min_lr
    learning_rate: 1e-6
    weight_decay: 0.05
    adam_beta1: 0.9
    adam_beta2: 0.95
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 4
    warmup_steps: 10
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: megatron_train
    strategy_config:
      sequence_parallel: false
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      use_distributed_optimizer: true
      recompute_granularity: full
      accumulate_allreduce_grads_in_fp32: true
      check_for_nan_in_loss_and_grad: false
  device_mapping: list(range(0,1))
  infer_batch_size: 2

actor_infer:
  model_args:
    flash_attn: fa2
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: 4096
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.6
    num_return_sequences: 1
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: sglang
    strategy_config:
      mem_fraction_static: 0.6
      load_format: auto
  device_mapping: list(range(0,1))

reference:
  model_args:
    flash_attn: fa2
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: hf_infer
    strategy_config: ~
  device_mapping: list(range(0,1))
  infer_batch_size: 2

enable_response_mask: True
action_sep: "||"
use_turn_scores: True
enable_think: True
max_actions_per_traj: 50
reward_normalization:
  grouping: tags
  method: mean
  separate_norm_for_selfplay: true
whiten_rewards: true
advantage_norm: mean
pg_clip_high: 0.20

custom_envs:
  PlaypenTaboo:
    env_type: playpen
    max_actions_per_traj: ${max_actions_per_traj}
    grid_vocab: false
    env_config:
      game_name: taboo
      built_in_opponent: none

train_env_manager:
  format_penalty: 0.05
  max_env_num_per_worker: 4
  env_groups: 4
  group_size: 1
  tags: [PlaypenTaboo]
  n_groups: [4]

val_env_manager:
  max_env_num_per_worker: 4
  env_groups: 4
  group_size: 1
  tags: [PlaypenTaboo]
  n_groups: [4]