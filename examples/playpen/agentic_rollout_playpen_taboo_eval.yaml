defaults:
  - ../config/envs@_here_
  - ../config/deepspeed_zero@_here_
  - ../config/deepspeed_zero2@_here_
  - ../config/deepspeed_zero3@_here_
  - ../config/deepspeed_zero3_cpuoffload@_here_

hydra:
  run:
    dir: .
  output_subdir: null

exp_name: "agentic_pipeline"
seed: 42

system_envs:
  USE_MODELSCOPE: '0'
  TORCHINDUCTOR_COMPILE_THREADS: '1'

track_with: tensorboard
tracker_kwargs:
  log_dir: ./runs/tensorboard

num_gpus_per_node: 1

# Rollout-only (no actor_train/reference, no weight updates) -- same idea as
# examples/model_game_eval/: a broader sweep than the "rollout" smoke test, meant to gauge
# actual gameplay performance rather than just prove the wiring works.
max_steps: 1
save_steps: 10000
logging_steps: 1
eval_steps: 10
resume_from_checkpoint: false

rollout_batch_size: 15
sequence_length: 4096

reward_clip: 20
advantage_clip: 10.0
ppo_epochs: 1
adv_estimator: "reinforce"
init_kl_coef: 0.0
whiten_advantages: true
entropy_loss_coef: 0

# Update this path to the model you want to evaluate (e.g. a trained checkpoint)
pretrain: Qwen/Qwen3-0.6B

actor_infer:
  model_args:
    disable_gradient_checkpointing: true
  generating_args:
    max_new_tokens: 2048
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.6
    num_return_sequences: 1
  data_args:
    template: qwen3
  strategy_args:
    strategy_name: sglang
    strategy_config:
      mem_fraction_static: 0.9
      load_format: auto
  device_mapping: list(range(0,1))

enable_response_mask: True
action_sep: "||"
use_turn_scores: False
enable_think: False
max_actions_per_traj: 10

custom_envs:
  PlaypenTaboo:
    env_type: playpen
    max_actions_per_traj: ${max_actions_per_traj}
    grid_vocab: false
    env_config:
      game_name: taboo
      built_in_opponent: none

train_env_manager:
  format_penalty: 0.05
  max_env_num_per_worker: 15
  env_groups: 15
  group_size: 1
  tags: [PlaypenTaboo]
  n_groups: [15]
